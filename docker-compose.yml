# 用 docker-compose 管理 si_land_server 依赖的基础设施（PostgreSQL + Redis）
# 启动：docker compose up -d
# 停止：docker compose down
# 清理数据卷：docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: siland-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siland}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siland123}
      POSTGRES_DB: ${POSTGRES_DB:-siland}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siland} -d ${POSTGRES_DB:-siland}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: siland-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-siland123}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-siland123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
